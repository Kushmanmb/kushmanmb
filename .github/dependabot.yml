version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/circuits"
      - "/pdf-utils"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
