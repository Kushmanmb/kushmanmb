name: Deploy ZKPDF

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - "docs/**"
      - "pdf-utils/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  attestations: write
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: "app/yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Make deploy script executable
        run: chmod +x scripts/deploy.sh

      - name: Deploy using unified script
        run: ./scripts/deploy.sh all

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined-deploy

      - name: Resolve uploaded Pages artifact ID
        id: resolve-pages-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              }
            );

            const artifact = [...data.artifacts]
              .reverse()
              .find((item) => item.name === "github-pages");

            if (!artifact) {
              core.setFailed("Unable to locate uploaded github-pages artifact.");
              return;
            }

            core.setOutput("artifact-id", String(artifact.id));

      - name: Download uploaded Pages artifact
        run: |
          curl -sSL \
            -u "x-access-token:$GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${{ steps.resolve-pages-artifact.outputs.artifact-id }}/zip" \
            -o "$RUNNER_TEMP/github-pages-artifact.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/github-pages-artifact.zip

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
